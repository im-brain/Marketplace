<!doctype html>
<!-- Source for assets/logo/og-retro.jpg (the 1200x630 share card). Rendered with
     Playwright from the repo's own pixel art; see worker/README.md. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0b7a78 url(../../retro/pebbles-day.svg) repeat;background-size:160px;image-rendering:pixelated;display:grid;place-items:center;font-feature-settings:"liga" 0,"clig" 0,"calt" 0;letter-spacing:.012em}
.win{width:1040px;background:#c4c4c4;padding:5px;box-shadow:inset -2px -2px #0b0b0b,inset 2px 2px #fff,inset -4px -4px #7d7d7d,inset 4px 4px #e2e2e2,10px 16px 0 rgba(0,0,0,.35)}
.tb{height:44px;display:flex;align-items:center;padding:0 14px;background:linear-gradient(90deg,#0d2668,#3c6fb0);color:#fff;font:700 24px 'Pixelify Sans'}
.banner{background:#16336b url(../../retro/waves.svg) repeat-x 0 100%;background-size:auto 120px;padding:40px 0 132px;text-align:center;border:3px solid #000;margin:8px 0 0}
.banner img{width:860px;height:auto;image-rendering:pixelated}
.banner p{margin:18px 0 0;font:700 46px/1 'Pixelify Sans';color:#ffe14d;text-shadow:3px 3px 0 #000}
.foot{display:flex;justify-content:space-between;align-items:center;padding:14px 10px 8px;font:500 30px 'Pixelify Sans';color:#111}
.foot b{background:#b3261e;color:#fff;padding:10px 18px;box-shadow:inset -2px -2px #000,inset 2px 2px #e0665c}
</style></head><body>
<div class="win">
  <div class="tb">Heavy Pockets Co. - Coming Soon</div>
  <div class="banner"><img src="../../retro/wordmark.svg" alt=""><p>Head down. Pockets full.</p></div>
  <div class="foot"><span>Tees and socks for Great Lakes rockhounds</span><b>Get first dibs</b></div>
</div>
</body></html>
