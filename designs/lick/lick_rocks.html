<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Lick Rocks Art</title>
<!-- Print art for design 7, "I lick rocks". A dull, dry Lake Superior agate with one glossy lick
     where the true color shows. Everything is drawn by code (original art).
     Render at print size:  node scripts/render_lick.js  (writes designs/lick/*.png)
     URL options: ?seed=7&text=1&ink=light|dark&w=1200 -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Young+Serif&display=swap" rel="stylesheet">
<style>
  :root{--bg:#2E3438;--ink:#EDE6D8}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#E7E3DA;--ink:#1F2D38}}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body.print{background:transparent}
  #art{display:block;margin:0 auto}
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200"></svg>
<script>
(function(){
"use strict";
var q=new URLSearchParams(location.search);
var PRINT=q.get("print")==="1",SEED=+(q.get("seed")||7), TEXT=q.get("text")!=="0", INK=q.get("ink")||"auto", W=+(q.get("w")||900);
if(q.get("print")==="1"){document.body.classList.add("print");document.documentElement.style.background="transparent";}
var NS="http://www.w3.org/2000/svg",art=document.getElementById("art");
art.setAttribute("width",W);art.setAttribute("height",W*1.2);
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var r=rng(SEED*104729);

/* Stone geometry: one shared wobble so the bands follow the rind, more angular inward (fortification). */
var H=[[.08+r()*.04,2,.5,r()*6.3],[.05+r()*.03,3,.8,r()*6.3],[.03,5,1.4,r()*6.3],[.012,9,2,r()*6.3],[.07,4,-.6,r()*6.3],[.045,6,-.8,r()*6.3],[.02,7,-.9,r()*6.3]];
var CX=500,CY=470,R=380;
function ring(cx,cy,s,jit){
  var N=420,pts=[];
  for(var i=0;i<N;i++){
    var th=i/N*Math.PI*2,m=1;
    for(var k=0;k<H.length;k++)m+=Math.min(H[k][0]*Math.pow(s,H[k][2]),.12)*Math.sin(H[k][1]*th+H[k][3]);
    var rr=R*s*m+(r()-.5)*jit;
    pts.push([cx+Math.cos(th)*rr,cy+Math.sin(th)*rr*.86]);
  }
  for(var pass=0;pass<2;pass++)pts=pts.map(function(p,i){var a=pts[(i+N-1)%N],b=pts[(i+1)%N];return[(a[0]+2*p[0]+b[0])/4,(a[1]+2*p[1]+b[1])/4];});
  return "M"+pts.map(function(p){return p[0].toFixed(1)+" "+p[1].toFixed(1);}).join("L")+"Z";
}

/* Lake Superior agate colors: iron reds and oranges, milky white, smoky gray, and a pale quartz core. */
var DARK=["#8E2414","#B5451F","#6E1F12","#C8622E","#5B3A30","#A33A1C"];
var LIGHT=["#F1E6D6","#E7D3BC","#F6EEE2","#D9C2A6"];
var RIND="#5A3B2C",CORE="#D9D4CB";

var defs=el("defs",{},art);
var outline=ring(CX,CY,1,0);
el("path",{d:outline},el("clipPath",{id:"stone"},defs));
/* the lick: a broad tongue-swipe, wider at the top, tapering as it drags down */
var LICK="M436 176 C462 136 566 134 592 172 C620 214 608 320 598 420 C588 520 578 588 548 628 C520 664 466 662 448 626 C428 588 432 502 428 420 C424 320 408 220 436 176 Z";
el("path",{d:LICK,transform:"rotate(-9 500 430)"},el("clipPath",{id:"lick"},defs));

/* textures */
var f=el("filter",{id:"dust",x:"0",y:"0",width:"100%",height:"100%"},defs);
el("feTurbulence",{type:"fractalNoise",baseFrequency:"1.1",numOctaves:"3",seed:String(SEED)},f);
el("feColorMatrix",{values:"0 0 0 0 .92  0 0 0 0 .90  0 0 0 0 .86  0 0 0 2.6 -1.2"},f);
var pit=el("filter",{id:"pits",x:"0",y:"0",width:"100%",height:"100%"},defs);
el("feTurbulence",{type:"turbulence",baseFrequency:".035",numOctaves:"4",seed:String(SEED+3)},pit);
el("feColorMatrix",{values:"0 0 0 0 .15  0 0 0 0 .08  0 0 0 0 .05  0 0 0 -1.4 .9"},pit);
var soft=el("filter",{id:"soft",x:"-20%",y:"-20%",width:"140%",height:"140%"},defs);el("feGaussianBlur",{stdDeviation:"14"},soft);
var soft2=el("filter",{id:"soft2",x:"-20%",y:"-20%",width:"140%",height:"140%"},defs);el("feGaussianBlur",{stdDeviation:"3"},soft2);
var edge=el("filter",{id:"edge",x:"-10%",y:"-10%",width:"120%",height:"120%"},defs);el("feGaussianBlur",{stdDeviation:"2.2"},edge);

/* draw the agate body once into a group we can reuse dry and wet */
var bodyG=el("g",{id:"body"},defs);
el("path",{d:outline,fill:RIND},bodyG);
el("rect",{x:"0",y:"0",width:"1000",height:"1000",filter:"url(#pits)",opacity:".55","clip-path":"url(#stone)"},bodyG);
var s=.9,ox=(r()-.5)*70,oy=(r()-.5)*50,bi=0,g=0;
while(s>.22&&g++<200){
  var cx=CX+ox*(1-s),cy=CY+oy*(1-s);
  if(r()<.34){var w=.03+r()*.055;el("path",{d:ring(cx,cy,s,2),fill:DARK[bi++%DARK.length]},bodyG);s-=w;}
  else{var n=5+Math.floor(r()*9);for(var j=0;j<n&&s>.22;j++){el("path",{d:ring(CX+ox*(1-s),CY+oy*(1-s),s,1.4),fill:j%2?LIGHT[(bi+j)%LIGHT.length]:DARK[(bi+j)%DARK.length],opacity:j%2?".92":"1"},bodyG);s-=.0045+r()*.007;}}
  if(r()<.25){el("path",{d:ring(CX+ox*(1-s),CY+oy*(1-s),s,1.5),fill:LIGHT[bi%LIGHT.length]},bodyG);s-=.015+r()*.02;}
}
el("path",{d:ring(CX+ox*.78,CY+oy*.78,Math.max(s,.18),5),fill:CORE},bodyG);
/* quartz sparkle in the core */
for(var k=0;k<60;k++){var a=r()*6.3,d=r()*R*.13;el("circle",{cx:CX+ox*.78+Math.cos(a)*d,cy:CY+oy*.78+Math.sin(a)*d*.86,r:1+r()*2.5,fill:"#FFFFFF",opacity:.25+r()*.4},bodyG);}

/* shadow */
if(!PRINT)el("ellipse",{cx:CX+10,cy:CY+R*.86+28,rx:R*.86,ry:34,fill:"rgba(0,0,0,.28)",filter:"url(#soft)"},art); /* no soft shadow in print: DTG prints it as a muddy smear */

/* DRY stone: desaturated, chalky, dusty */
var dry=el("g",{"clip-path":"url(#stone)"},art);
el("use",{href:"#body",style:"filter:saturate(.42) brightness(1.12) contrast(.8)"},dry);
el("rect",{x:"0",y:"0",width:"1000",height:"1000",filter:"url(#dust)",opacity:".6"},dry);
el("path",{d:outline,fill:"#E9E4DA",opacity:".16"},dry);

/* WET lick: full color, glossy */
var wet=el("g",{"clip-path":"url(#stone)"},art);
var wl=el("g",{"clip-path":"url(#lick)"},wet);
el("use",{href:"#body",style:"filter:saturate(1.12) contrast(1.06)"},wl);
el("path",{d:LICK,fill:"rgba(0,0,0,.07)",transform:"rotate(-9 500 430)"},wl);
/* wet edge: a slightly darker halo where water meets dry stone */
el("path",{d:LICK,fill:"none",stroke:"rgba(40,20,12,.35)","stroke-width":"7",filter:"url(#edge)",transform:"rotate(-9 500 430)"},wet);
/* specular highlights on the wet streak */
var gl=el("g",{"clip-path":"url(#lick)"},wet);
el("path",{d:"M470 190 C455 260 470 360 488 430",stroke:"rgba(255,255,255,.85)","stroke-width":"16","stroke-linecap":"round",fill:"none",filter:"url(#soft2)",transform:"rotate(-9 500 430)"},gl);
el("path",{d:"M540 200 C560 240 566 300 560 340",stroke:"rgba(255,255,255,.45)","stroke-width":"9","stroke-linecap":"round",fill:"none",filter:"url(#soft2)",transform:"rotate(-9 500 430)"},gl);
el("ellipse",{cx:"512",cy:"540",rx:"10",ry:"26",fill:"rgba(255,255,255,.55)",filter:"url(#soft2)",transform:"rotate(-9 500 430)"},gl);

/* rim light on the whole stone */
if(!PRINT)el("path",{d:outline,fill:"none",stroke:"rgba(255,255,255,.12)","stroke-width":"6"},art);

if(TEXT){
  var dark=INK==="dark"||(INK==="auto"&&matchMedia("(prefers-color-scheme: light)").matches);
  var t=el("text",{x:"500",y:"1110","text-anchor":"middle",fill:INK==="auto"?"currentColor":(dark?"#1F2D38":"#EDE6D8"),
    style:"font-family:Archivo,sans-serif;font-weight:900;font-stretch:72%;font-size:150px;letter-spacing:-1px;text-transform:uppercase"},art);
  t.textContent="I lick rocks";
}
document.body.setAttribute("data-ready","1");
})();
</script>
</body>
</html>
